<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>现代音乐播放器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #2c2c2c;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .player-container {
            background: linear-gradient(135deg, #2c2c2c, #000000);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            color: white;
        }

        .album-cover {
            width: 100%;
            height: 300px;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .album-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .song-info {
            text-align: center;
            margin-bottom: 25px;
        }

        .song-title {
            font-size: 22px;
            font-weight: bold;
            color: white;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .artist-name {
            font-size: 16px;
            color: #aaa;
            font-weight: 300;
        }

        .progress-container {
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background-color: #555;
            border-radius: 3px;
            overflow: hidden;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .progress {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #00aaff);
            width: 0%;
            transition: width 0.1s ease;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #aaa;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin-bottom: 25px;
        }

        .control-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            color: white;
            background-color: rgba(255, 255, 255, 0.1);
        }

        .play-btn {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #00d4ff, #00aaff);
            color: white;
            font-size: 24px;
        }

        .play-btn:hover {
            transform: scale(1.1);
            background: linear-gradient(135deg, #00aaff, #0088ff);
        }

        .lyrics-container {
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 20px;
            max-height: 150px;
            overflow-y: auto;
        }

        .lyrics {
            text-align: center;
            line-height: 1.8;
        }

        .lyric-line {
            padding: 5px 0;
            color: #aaa;
            transition: all 0.3s ease;
        }

        .current-lyric {
            color: #ffffff;
            font-weight: bold;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="player-container">
        <div class="album-cover">
            <img src="https://img.alicdn.com/imgextra/i3/O1CN01HKF8IE21NglxmBjwj_!!6000000006973-2-tps-456-502.png" alt="专辑封面">
        </div>

        <div class="song-info">
            <div class="song-title">Fade Before The Dawn</div>
            <div class="artist-name">Joyful Supplyment</div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar">
                <div class="progress" id="progress"></div>
            </div>
            <div class="time-info">
                <span id="currentTime">0:00</span>
                <span id="totalTime">4:59</span>
            </div>
        </div>

        <div class="controls">
            <button class="control-btn" id="shuffleBtn">
                <i class="fas fa-random"></i>
            </button>
            <button class="control-btn" id="prevBtn">
                <i class="fas fa-step-backward"></i>
            </button>
            <button class="control-btn play-btn" id="playBtn">
                <i class="fas fa-play"></i>
            </button>
            <button class="control-btn" id="nextBtn">
                <i class="fas fa-step-forward"></i>
            </button>
            <button class="control-btn" id="repeatBtn">
                <i class="fas fa-redo"></i>
            </button>
        </div>

        <div class="lyrics-container">
            <div class="lyrics" id="lyrics">
                <div class="lyric-line current-lyric">Fade before the dawn</div>
                <div class="lyric-line">晨曦来临前的消逝</div>
                <div class="lyric-line">In the shadows of the night</div>
                <div class="lyric-line">夜幕下的影子</div>
                <div class="lyric-line">We will find our way again</div>
                <div class="lyric-line">我们将再次找到方向</div>
            </div>
        </div>
    </div>

    <script>
        // 播放器状态
        let isPlaying = false;
        let currentTime = 0;
        let duration = 299; // 4:59 in seconds
        let lyricsIndex = 0;

        // DOM元素
        const playBtn = document.getElementById('playBtn');
        const progressBar = document.getElementById('progressBar');
        const progress = document.getElementById('progress');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const lyricsLines = document.querySelectorAll('.lyric-line');

        // 设置总时间
        totalTimeEl.textContent = formatTime(duration);

        // 播放/暂停按钮事件
        playBtn.addEventListener('click', togglePlay);

        // 进度条点击事件
        progressBar.addEventListener('click', setProgress);

        function togglePlay() {
            isPlaying = !isPlaying;
            
            if (isPlaying) {
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                startTimer();
            } else {
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
            }
        }

        function startTimer() {
            if (!isPlaying) return;

            setInterval(() => {
                if (isPlaying && currentTime < duration) {
                    currentTime++;
                    updateProgress();
                    
                    // 更新歌词显示
                    updateLyrics();
                } else if (currentTime >= duration) {
                    isPlaying = false;
                    playBtn.innerHTML = '<i class="fas fa-play"></i>';
                }
            }, 1000);
        }

        function updateProgress() {
            const progressPercent = (currentTime / duration) * 100;
            progress.style.width = `${progressPercent}%`;
            currentTimeEl.textContent = formatTime(currentTime);
        }

        function setProgress(e) {
            const width = this.clientWidth;
            const clickX = e.offsetX;
            const newTime = (clickX / width) * duration;
            
            currentTime = Math.floor(newTime);
            updateProgress();
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function updateLyrics() {
            // 计算当前应该高亮的歌词行
            const totalLyrics = lyricsLines.length;
            const lyricDuration = duration / totalLyrics;
            const newLyricsIndex = Math.floor(currentTime / lyricDuration);
            
            if (newLyricsIndex !== lyricsIndex && newLyricsIndex < totalLyrics) {
                lyricsIndex = newLyricsIndex;
                
                // 移除所有当前歌词类
                lyricsLines.forEach(line => line.classList.remove('current-lyric'));
                
                // 添加当前歌词类到新行
                if (lyricsLines[lyricsIndex]) {
                    lyricsLines[lyricsIndex].classList.add('current-lyric');
                    
                    // 平滑滚动到当前歌词
                    const container = document.querySelector('.lyrics-container');
                    container.scrollTop = lyricsLines[lyricsIndex].offsetTop - container.clientHeight / 2;
                }
            }
        }

        // 控制按钮功能（模拟）
        document.getElementById('prevBtn').addEventListener('click', () => {
            currentTime = Math.max(0, currentTime - 10);
            updateProgress();
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            currentTime = Math.min(duration, currentTime + 10);
            updateProgress();
        });

        document.getElementById('shuffleBtn').addEventListener('click', () => {
            alert('随机播放模式已开启');
        });

        document.getElementById('repeatBtn').addEventListener('click', () => {
            alert('单曲循环模式已开启');
        });
    </script>
</body>
</html>
