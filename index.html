console.log(sumNum);


    let ab=[3,4,2,6,5,6,7,77,345,344,445,324,1234,34]
    function mappao(arr){
      for(let i=0;i<arr.length-1;i++){
        for(let j=0;j<arr.length-i-1;j++){
          if(arr[j]>arr[j+1]){
          let temp= arr[j];
          arr[j]=arr[j+1];
          arr[j+1]=temp;
          }
        }
      }
      return arr;
    }


    
    console.log("冒泡后的数据是",mappao(ab));
