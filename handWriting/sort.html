<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
  let arr=[3,2,5,4,8,6,9,7,1]
  function maopao(arr){
    for(let i=0;i<arr.length;i++){
      for(let j=0;j<arr.length-i-1;j++){
        if(arr[j]>arr[j+1]){
          let temp=arr[j];
          arr[j]=arr[j+1];
          arr[j+1]=temp;
        }

      }
    }
    return arr;

  }

  console.log(maopao(arr))
</script>
</body>
</html>
