<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<style>
    .bigBox1{
        margin: 0 auto;
        width: 500px;
        height: 500px;
        border: 1px solid black;
        display:flex;
        justify-content:center;
        align-items:center;
    }
    .smallBox1{
        width: 200px;
        height: 200px;
        border: 1px solid black;
        background-color: lightgray;
    }
    .bigBox2{
        margin: 0 auto;
        width: 500px;
        height: 500px;
        border: 1px solid black;
        position:relative;
    }
    .smallBox2{
        width: 200px;
        height: 200px;
        border: 1px solid black;
        background-color: lightgray;
        position:absolute;
        top:50%;
        left:50%;
        transform:translate(-50%,-50%);
    }
    .bigBox3{
        margin: 0 auto;
        width: 500px;
        height: 500px;
        border: 1px solid black;
   display: grid;
        place-items:center;
    }
    .smallBox3{
        width: 200px;
        height: 200px;
        border: 1px solid black;
        background-color: lightgray;

    }
</style>
<body>

<div class="bigBox1">

    <div class="smallBox1">
        flex实现
    </div>

</div>

<div class="bigBox2">

    <div class="smallBox2">
        绝对定位实现
    </div>

</div>
<div class="bigBox3">

    <div class="smallBox3">
        grid布局实现
    </div>

</div>
</body>
</html>
